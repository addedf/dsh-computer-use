<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>DSH · Chrome</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <span class="brand-icon" aria-hidden="true"><img src="icon.svg" width="28" height="28" alt=""></span>
    <div><h1>DSH <span>/ Chrome</span></h1><p>浏览器助手</p></div>
    <span class="local-label">本机连接</span>
  </header>
  <main>
    <section id="connection-card" class="connection-card" aria-label="连接状态">
      <div class="status-line"><span id="status-dot" class="status-dot" aria-hidden="true"></span><p id="connection" role="status">正在读取状态…</p></div>
      <p id="connection-note" class="connection-note">首次授权后，下次自动连接，无需重复操作。</p>
      <div class="connection-actions"><button id="connect" class="connect-button" disabled>授权并连接</button><button id="revoke-offline" class="text-button revoke" hidden>撤销授权</button></div>
      <p id="error" role="alert" hidden></p>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
